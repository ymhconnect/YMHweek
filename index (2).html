const V={

${tick()}<div class="band b2"><div class="in c"><h2>In 2026, students from 500 colleges signed up.</h2><p class="lede">Here's everything the week was, in one minute.</p><div class="filmw">${film()}</div><div class="row"><button class="btn" data-go="y2026">Know more about the 2026 edition</button></div></div></div>
<div class="band b3"><div class="in doors"><button class="door" data-go="y2026"><i class="tp"></i><img src="n_vnc.webp" alt="Students together on campus"><span class="go">Look back at 2026</span><p>Expert sessions, shared stories and campus spaces, created with young people.</p></button><button class="door" data-go="y2027"><i class="tp"></i><img src="n_hall.webp" alt="A large group of students together at a YMH Week session"><span class="go">See the plan for 2027</span><p>Our plans to bring mental health support closer to campuses.</p></button></div></div>
<div class="band b4"><div class="in c"><h2>2026 campaign contributors</h2><p class="lede">Everyone who gave their time, knowledge and care so that young people could feel heard.</p></div>${logoRow()}<div class="in c">${pbtn("Join as a partner")}</div></div>${foot}`,
y2026:()=>`<div class="sub"><div>${[["ini","Initiatives"],["imp","Impact"],["cam","On campus"],["spk","Speakers"],["sum","Summit"],["voi","Messages"],["vid","Video messages"],["news","In the news"]].map(x=>`<button data-to="${x[0]}">${x[1]}</button>`).join("")}</div></div>
<div class="band first"><div class="in trio"><div><h2>Inside YMH Week 2026.</h2><p class="lede">A look at how the week unfolded, and the people who made it happen.</p></div><div class="shapes"><img class="s1" src="n_mand2.webp" alt="Students holding up the mandalas they made"><video class="s2" src="loop2.mp4" autoplay muted loop playsinline aria-label="Students putting up a YMH Week poster"></video><img class="s3" src="n_colour.webp" alt="Students drawing at a campus stall" style="object-position:50% 62%"></div></div></div>
<div class="band b2" id="ini"><div class="in c"><h2>Four ways to be part of it.</h2><p class="lede">To ask, to listen, to share or simply to be there. Everyone found their own way in.</p></div><div class="in four">
<article class="nt link" data-to="spk" role="link" tabindex="0"><i class="tp"></i><div class="mix"><img src="sp16.webp" alt=""><img src="sp13.webp" alt=""><img src="sp04.webp" alt=""></div><h3>Mann-E-Guftagu</h3><p class="tag">Ask what you've always wondered.</p><p>Open sessions with leading experts on therapy, relationships, careers and more.</p><span class="more">Meet the speakers</span></article>
<article class="nt link" data-to="voi" role="link" tabindex="0"><i class="tp"></i><img src="n_hands.webp" alt="A student leaving a handprint on a shared wall" style="object-position:50% 40%"><h3>Voices for Change</h3><p class="tag">Sometimes, one message is enough.</p><p>People put their feelings into words, so someone else could find theirs.</p><span class="more">Read the messages</span></article>
<article class="nt link" data-to="sum" role="link" tabindex="0"><i class="tp"></i><img src="n_hindu.webp" alt="Participants together on stage at the Mental Health Summit"><h3>Mental Health Summit</h3><p class="tag">Room for every story.</p><p>Talks and cultural performances at Hindu College, shaped around young people.</p><span class="more">See the summit</span></article>
<article class="nt link" data-to="cam" role="link" tabindex="0"><i class="tp"></i><img src="j_5936.webp" alt="Students taking part in an activity at a campus booth" style="object-position:50% 30%"><h3>On-campus booths</h3><p class="tag">A moment to pause.</p><p>Art, activities and space to reflect, right where students already were.</p><span class="more">See the campuses</span></article></div></div>
<div class="band b3" id="imp"><div class="in c"><h2>Young people showed up.</h2><p class="lede">Behind every number is someone who chose to be there.</p></div><div class="in pet"><div><b>28</b><span>states</span></div><div><b>500</b><span>colleges</span></div><div><b>1,000+</b><span>attendees</span></div><div><b>1M+</b><span>digital impressions</span></div><div><b>100+</b><span>volunteers trained as advocates</span></div><div><b>100+</b><span>Voices for Change reflections</span></div><div><b>15</b><span>partner organisations</span></div></div><div class="in c">${pbtn("Help us reach more young people")}</div></div>
<div class="band b4" id="cam"><div class="in c"><h2>Spotted on campus.</h2><p class="lede">Posters on noticeboards and a booth that was hard to walk past. Here's the week up close.</p></div>${(()=>{const c=CAMPUS.map(g=>`<figure class="ph"><img loading="lazy" src="${g[0]}.webp" alt="YMH Week on campus"></figure>`).join("");return `<div class="mq" style="--d:90s"><div>${c}${c}</div></div>`})()}</div>
<div class="band" id="spk"><div class="in c"><h2>Sessions on what young people carry.</h2><p class="lede">Pressure, relationships, identity, careers and exclusion, explored with care by people who understand them. Tap a speaker for their session title.</p></div>${(()=>{const c=SPEAKERS.map((s,i)=>`<button class="sp" data-sp="${i}"><span class="pic"><img loading="lazy" src="sp${n2(i+1)}.webp" alt="${esc(s[0])}"></span><b>${esc(s[0])}</b></button>`).join("");return `<div class="mq" style="--d:90s"><div>${c}${c}</div></div>`})()}</div>
<div class="band b3" id="sum"><div class="in trio"><div><h2>A day together at Hindu College.</h2><p class="lede">The Mental Health Summit brought young people and experts into one room for talks and cultural performances.</p></div><div class="heroimg" style="margin-top:0"><span class="stamp"><b>300+</b>attendees</span><img src="n_hindu.webp" alt="Participants together on stage at the Mental Health Summit" style="aspect-ratio:16/10"></div></div></div>
<div class="band b2" id="voi"><div class="in c"><h2>Open when you need it.</h2><p class="lede">Little notes on speaking up, asking for support and getting through the hard days. One of them might be meant for you.</p></div><div class="in strip">${EXPERTS.map((e,i)=>`<button class="vc" data-ex="${i}" aria-label="Open message"><img loading="lazy" src="ex${n2(e[0])}.jpg" alt="Voices for Change message"></button>`).join("")}${STORIES.map(p=>`<button class="vc" data-img="st${n2(p)}.jpg" aria-label="Open message"><img loading="lazy" src="st${n2(p)}.jpg" alt="Voices for Change message"></button>`).join("")}</div></div>
<div class="band b3" id="vid"><div class="in c"><h2>Words you might need to hear.</h2><p class="lede">Familiar faces, kind words and honest reminders, from people who care about young people's wellbeing.</p></div><div class="in strip">${VIDEOS.map((n,i)=>`<figure class="vm"><video controls preload="none" poster="vp${n2(i+1)}.jpg" src="m${n2(i+1)}.mp4" aria-label="Video message from ${esc(n)}"></video><figcaption>${esc(n)}</figcaption></figure>`).join("")}</div></div>
<div class="band b4" id="news"><div class="in c"><h2>In the news.</h2><p class="lede">Youth Mental Health Week was covered in the press. Read what they wrote.</p></div><div class="in press"><a href="https://newswatchindia.com/youth-mental-health-2026-ymh-confab/" target="_blank" rel="noopener"><b>News Watch India</b><span>Read the article</span></a><a href="https://digitalinternational.in/lived-experiences-as-a-central-conversation-at-youth-mental-health-week/" target="_blank" rel="noopener"><b>Digital International</b><span>Read the article</span></a><a href="https://tvtodaybharat.com/mental-health-confab-2026-delhi-youth-workshops/" target="_blank" rel="noopener"><b>TV Today Bharat</b><span>Read the article</span></a></div></div>${foot}`,
y2027:()=>`<div class="band first b2"><div class="in c"><h2>Ready. Set. April.</h2><div class="chips"><span>3rd edition</span><span>4 to 10 April 2027</span></div><div class="heroimg" style="max-width:820px"><img src="team.jpg" alt="The Youth for Mental Health team together" style="aspect-ratio:1100/1020;object-position:50% 50%"></div></div></div>
<div class="band" ><div class="in c"><h2>What we'll do in 2027.</h2><p class="lede">Four components, co-designed and led by young people.</p></div><div class="in four">
<article class="nt"><i class="tp"></i><img src="n_booth.webp" alt="Students taking part at a campus stall"><h3>Campus takeovers</h3><p>Student teams across states bring mental health conversations to their own campuses.</p></article>
<article class="nt"><i class="tp"></i><img src="n_yellow.webp" alt="A group of young advocates together"><h3>Become an advocate</h3><p>We train students to lead mental health activities in their own colleges.</p></article>
<article class="nt"><i class="tp"></i><img src="stage.jpg" alt="Young people performing on stage"><h3>Lived Experience Youth Summit</h3><p>A summit for young people with lived experience.</p></article>
<article class="nt"><i class="tp"></i><img src="n_colour.webp" alt="Students working on a sheet about getting help" style="object-position:50% 78%"><h3>Mental health resources</h3><p>Free, expert-reviewed resources on the key stressors young people face.</p></article></div></div>
<div class="band b3"><div class="in c"><h2>Where we're headed.</h2><p class="lede">More young people, more campuses and a culture where support feels normal.</p></div><div class="in pet six"><div><b>100K</b><span>young people reached</span></div><div><b>1,000</b><span>campuses engaged</span></div><div><b>28</b><span>states and UTs reached</span></div><div><b>150</b><span>mental health advocates trained</span></div><div><b>10,000</b><span>young people receiving resources</span></div><div><b>10M</b><span>digital impressions</span></div></div><div class="in sts"><div>Support resources created on the key stressors young people face</div><div>India's first-ever Lived Experience Youth Summit</div></div><div class="in c">${pbtn("Help us get there")}</div></div>${foot}`,
partner:()=>`<div class="band first"><div class="in trio ptop"><div class="pl"><h2>We need your support. Partner with us.</h2><p class="quote">Policy can put a counsellor on campus. Only culture gets students through the door.</p><p class="hl">Help young people build that culture, together.</p><div class="row"><button class="btn" data-talk>Talk to our team</button></div></div><img class="pbig" src="n_hall.webp" alt="A large group of students together at a YMH Week session" style="object-position:50% 62%"></div></div>
<div class="band b3"><div class="in c"><h2>2026 campaign supporters</h2><p class="lede">Everyone who gave their time, knowledge and care so that young people could feel heard.</p></div>${logoRow()}<div class="in c"><div class="row"><button class="btn" data-talk>Join as a partner</button></div></div></div>${foot}`};
function timer(){const e=$("#timer");if(!e)return;const x=Math.max(0,new Date("2027-04-04T00:00:00+05:30")-Date.now());e.innerHTML=[[Math.floor(x/864e5),"days"],[Math.floor(x/36e5)%24,"hours"],[Math.floor(x/6e4)%60,"minutes"],[Math.floor(x/1e3)%60,"seconds"]].map(a=>`<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join("")}
function scrollToId(id){const a=document.getElementById(id),c=$(".sub"),m=$("#main");m.scrollTop=a.getBoundingClientRect().top-m.getBoundingClientRect().top+m.scrollTop-c.offsetHeight}
function go(id){if(!V[id])id="home";$("#main").innerHTML=V[id]();$("#main").scrollTop=0;$$("#nav button").forEach(b=>b.dataset.go==id?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));timer();deco();count()}
const SH=['<path d="M8 12h48v30H30L18 54V42H8z" fill="F" stroke="#2B2347" stroke-width="3"/>','<path d="M4 34c8-16 12-16 20 0s12 16 20 0 12-16 16-8" fill="none" stroke="F" stroke-width="7" stroke-linecap="round"/>','<path d="M32 4l7 21 21 7-21 7-7 21-7-21-21-7 21-7z" fill="F" stroke="#2B2347" stroke-width="3"/>','<path d="M24 6h16v18h18v16H40v18H24V40H6V24h18z" fill="F" stroke="#2B2347" stroke-width="3"/>','<path d="M8 8h48v30H34v-1L46 56 26 38H8z" fill="F" stroke="#2B2347" stroke-width="3"/>'],CL=['#FFC24B','#8ADBC6','#B8A1EB','#FFFDF7'],PS=[[1,10],[97,46],[1,62],[97,84],[1,34],[97,18]];
function deco(){$$(".band").forEach((b,i)=>{const left=!!b.querySelector(".in:not(.c) h2");[0,1,2].forEach(k=>{const p=PS[(i*2+k)%PS.length];if(left&&p[0]<50)return;const e=document.createElementNS("http://www.w3.org/2000/svg","svg");e.setAttribute("viewBox","0 0 64 64");e.setAttribute("class","dec");e.setAttribute("aria-hidden","true");e.style.left=p[0]+"%";e.style.top=p[1]+"%";e.style.animationDelay=-k*1.7+"s";e.innerHTML=SH[(i+k*2)%SH.length].replace("F",CL[(i+k)%CL.length]);if(p[0]>50)e.style.left="calc("+p[0]+"% - 64px)";b.append(e)})})}
const calm=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function count(){if(calm()||!("IntersectionObserver"in window))return;const o=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;o.unobserve(en.target);const b=en.target,t=b.textContent,m=t.match(/^([\d,]+)(.*)$/);if(!m)return;const v=+m[1].replace(/,/g,""),a=performance.now();(function f(n){const p=Math.min(1,(n-a)/1000);b.textContent=Math.round(v*p*(2-p)).toLocaleString("en-IN")+m[2];if(p<1)requestAnimationFrame(f);else b.textContent=t})(a)}),{root:$("#main"),threshold:.5});$$(".pet b").forEach(b=>o.observe(b))}
function burst(x,y){if(calm())return;for(let i=0;i<16;i++){const d=document.createElement("i"),a=i/16*6.28,r=70+Math.random()*90;d.className="bit";d.style.cssText=`left:${x}px;top:${y}px;background:${CL[i%3]};border:2px solid #2B2347;border-radius:${i%2?"50%":"2px"}`;document.body.append(d);requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) rotate(${i*40}deg)`;d.style.opacity=0}));setTimeout(()=>d.remove(),900)}}
function sheet(h){$("#sheetBody").innerHTML=h+`<div class="row"><button class="btn" id="cl">Close</button></div>`;$("#sheet").hidden=false;$("#cl").focus()}
$("#nav").innerHTML=MENU.map(m=>`<button data-go="${m[0]}">${m[1]}</button>`).join("");
document.addEventListener("click",e=>{if(e.target.closest(".timer div,.pet>div"))burst(e.clientX,e.clientY);const t=e.target.closest("button,[data-to]");if(e.target.id=="sheet"||(t&&t.id=="cl"))return void($("#sheet").hidden=true);if(!t)return;if(t.hasAttribute("data-film")){const f=document.createElement("iframe");f.className="film";f.src=AFTERMOVIE;f.title="YMH Week 2026 aftermovie";f.allow="autoplay; fullscreen";f.allowFullscreen=true;t.replaceWith(f);return}if(t.hasAttribute("data-talk")){const sub=encodeURIComponent("Partnering on YMH Week 2027");sheet(`<h3>Talk to our team</h3><p style="margin:10px 0;font-weight:800;overflow-wrap:anywhere" id="em">${EMAIL}</p><div class="row" style="margin-top:12px"><a class="btn" href="https://mail.google.com/mail/?view=cm&to=${EMAIL}&su=${sub}" target="_blank" rel="noopener">Write in Gmail</a><a class="btn" href="mailto:${EMAIL}?subject=${sub}" target="_top">Open email app</a><button class="btn" id="cp">Copy email</button></div>`);return}if(t.id=="cp"){const done=()=>t.textContent="Copied";if(navigator.clipboard)navigator.clipboard.writeText(EMAIL).then(done,()=>window.getSelection().selectAllChildren($("#em")));else window.getSelection().selectAllChildren($("#em"));return}if(t.dataset.go)go(t.dataset.go);if(t.dataset.to)scrollToId(t.dataset.to);if(t.dataset.img)sheet(`<img alt="Message" src="${t.dataset.img}">`);if(t.dataset.ex){const x=EXPERTS[t.dataset.ex];sheet([x[0],...x[1]].map(p=>`<img alt="Message" src="ex${n2(p)}.jpg">`).join(""))}if(t.dataset.sp){const s=SPEAKERS[t.dataset.sp];sheet(`<h3>${esc(s[0])}</h3><p style="margin-top:8px;font-weight:700">${esc(s[1])}</p>`)}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.to)scrollToId(e.target.dataset.to);if(e.key=="Escape")$("#sheet").hidden=true});
setInterval(timer,1e3);go("home");
</script>
