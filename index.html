document.addEventListener("click",e=>{const t=e.target.closest("button");if(e.target.id=="sheet"||(t&&t.id=="cl"))return void($("#sheet").hidden=true);if(!t)return;if(t.dataset.go)go(t.dataset.go);if(t.dataset.to)scrollToId(t.dataset.to);if(t.dataset.img)sheet(`<img alt="Enlarged card" src="${t.dataset.img}" onerror="this.replaceWith('This image could not load.')">`);if(t.dataset.ex){const x=EXPERTS[t.dataset.ex];sheet([x[0],...x[1]].map(p=>`<img alt="Voices for Change message" src="img/ex${n2(p)}.jpg">`).join(""))}if(t.dataset.sp){const s=SPEAKERS[t.dataset.sp],i=+t.dataset.sp+1;sheet(`<img alt="${esc(s[0])}" src="img/sp${n2(i)}.webp" style="max-height:300px;object-fit:contain;background:var(--butter)"><h3>${esc(s[0])}</h3><p style="margin-top:6px">${esc(s[1])}</p>`)}if(t.id=="helpBtn")sheet(`<h3>You don't have to handle this alone</h3><ul><li>Tele-MANAS, free and open 24/7: <a href="tel:14416" target="_top">14416</a> or <a href="tel:18008914416" target="_top">1800-891-4416</a></li><li>Childline, for under-18s: <a href="tel:1098" target="_top">1098</a></li><li>In immediate danger: <a href="tel:112" target="_top">112</a></li></ul>`)});
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("#sheet").hidden=true});
setInterval(timer,1e3);go("home");
</script>
</body></html>
